# 把新版本同步到 Homebrew tap（XiaoMiku01/homebrew-tap）。
#
# ⚠️ 为什么不用 `on: release: published`：
#   release.yml 是用 GITHUB_TOKEN 建的 Release，而 GITHUB_TOKEN 触发的事件
#   **不会**再触发别的工作流（GitHub 防递归机制）。挂 release 事件会永远不响。
#   所以这里走 workflow_call，由 release.yml 显式调用。
#
# 凭据：homebrew-tap 上装了一把写权限 deploy key，私钥存在本仓库的
# HOMEBREW_TAP_DEPLOY_KEY secret 里。GITHUB_TOKEN 跨不了仓库，只能这样。
# 该密钥的权限仅限那一个仓库，泄露的爆炸半径就是 tap 本身。

name: Update Homebrew Tap

on:
  workflow_call:
    inputs:
      tag:
        description: "要同步的 tag，例如 v0.1.0"
        required: true
        type: string
  # 手工重新同步用：tap 被改坏了、或某次自动同步失败时可以单独补跑。
  workflow_dispatch:
    inputs:
      tag:
        description: "要同步的 tag，例如 v0.1.0"
        required: true
        type: string

jobs:
  update:
    name: 同步 formula 到 ${{ inputs.tag }}
    runs-on: macos-26

    steps:
      - name: 计算源码 tarball 的 sha256
        id: src
        run: |
          tag="${{ inputs.tag }}"
          url="https://github.com/${GITHUB_REPOSITORY}/archive/refs/tags/${tag}.tar.gz"
          for i in 1 2 3 4 5; do
            if curl -fsSL "$url" -o src.tar.gz; then break; fi
            echo "第 ${i} 次未取到源码归档，5 秒后重试…"
            sleep 5
          done
          test -s src.tar.gz || { echo "::error::拿不到源码归档 ${url}"; exit 1; }
          {
            echo "url=${url}"
            echo "sha256=$(shasum -a 256 src.tar.gz | awk '{print $1}')"
            echo "version=${tag#v}"
          } >> "$GITHUB_OUTPUT"

      - name: 配置 deploy key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null

      - name: 检出 tap
        run: git clone git@github.com:XiaoMiku01/homebrew-tap.git tap

      - name: 改写 formula（tetherkit 与 tetherkit-cli）
        working-directory: tap
        run: |
          # 两个 formula 共用同一份源码 tarball，url/sha256 一起改。
          # 用 perl 而不是 sed -i：BSD/GNU 的 -i 语义不一致，perl 两边都一样。
          for f in Formula/tetherkit.rb Formula/tetherkit-cli.rb; do
            perl -pi -e 's|^  url ".*"|  url "${{ steps.src.outputs.url }}"|' "$f"
            perl -pi -e 's|^  sha256 ".*"|  sha256 "${{ steps.src.outputs.sha256 }}"|' "$f"

            # 确认真的改成了预期的值 —— 正则没匹配上时 perl 是静默不动的，
            # 不显式核对的话会推上去一个纹丝未动的 formula 还以为成功了。
            grep -q 'url "${{ steps.src.outputs.url }}"' "$f" \
              || { echo "::error::${f} 的 url 没改成功"; exit 1; }
            grep -q 'sha256 "${{ steps.src.outputs.sha256 }}"' "$f" \
              || { echo "::error::${f} 的 sha256 没改成功"; exit 1; }
            ruby -c "$f"
          done

      # 推之前先证明改出来的 formula 真的能用。brew install 会校验 sha256
      # 是否与 tarball 相符，等于把「校验和写错」这一类错误彻底挡在推送之前。
      - name: 验证两个 formula 可安装
        run: |
          tap_dir="$(brew --repository)/Library/Taps/xiaomiku01/homebrew-tap"
          mkdir -p "$(dirname "$tap_dir")"
          ln -s "${GITHUB_WORKSPACE}/tap" "$tap_dir"

          brew audit --strict --online xiaomiku01/tap/tetherkit-cli
          brew audit --strict --online xiaomiku01/tap/tetherkit

          brew install --build-from-source xiaomiku01/tap/tetherkit-cli
          test "$(tetherkit-cli --version | head -1)" \
            = "TetherKit ${{ steps.src.outputs.version }} (C++23, macOS 13.3+)"

          brew install --build-from-source xiaomiku01/tap/tetherkit
          app="$(brew --prefix)/opt/tetherkit/TetherKit.app"
          test -d "$app"
          codesign --verify --deep --strict "$app"
          "$app/Contents/MacOS/TetherKit" --install-finder-alias

          brew uninstall tetherkit tetherkit-cli

      - name: 提交并推送
        working-directory: tap
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "formula 已经是 ${{ inputs.tag }}，无需改动。"
            exit 0
          fi
          git commit -am "tetherkit + tetherkit-cli ${{ steps.src.outputs.version }}"
          git push
          echo "已把 tap 同步到 ${{ inputs.tag }}" >> "$GITHUB_STEP_SUMMARY"
